<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fbf7ef">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Doggy Battle</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="start" class="screen" hidden>
  <button id="play" class="btn big" aria-label="Spielen">▶️</button>
  <svg id="preview" class="preview"></svg>
  <div class="startbar">
    <button id="start-home" class="btn hold" aria-label="Elternmenü (3 Sekunden halten)">🏠</button>
    <button id="restart" class="btn" aria-label="Ganz von vorne">🔄</button>
  </div>
</main>
<main id="game" class="screen" hidden>
  <div class="topbar">
    <button id="home" class="btn hold" aria-label="Start">🏠</button>
    <div id="dots" class="dots" aria-hidden="true"></div>
    <div class="actions">
      <button id="undo" class="btn" aria-label="Rückgängig">↩️</button>
      <button id="hint" class="btn" aria-label="Hinweis">💡</button>
    </div>
  </div>
  <div class="board-wrap"><svg id="board"></svg></div>
  <button id="next" class="btn big next" aria-label="Weiter" hidden>▶️</button>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
